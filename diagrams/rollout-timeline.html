<!DOCTYPE html><html><head><meta charset="utf-8"><style>
 html,body{margin:0;background:#fff;font-family:system-ui,"Segoe UI",Arial,sans-serif}

<svg width="1100" height="470" viewBox="0 0 1100 470" xmlns="http://www.w3.org/2000/svg">
 <text x="20" y="34" font-size="20" font-weight="700">Multi-Site Rollout Plan — 60 Restaurants in 24 Weeks</text>
 <!-- week grid -->
 <g font-size="11" fill="#7A838E" text-anchor="middle">

 </g>

  <line x1="650" y1="80" x2="650" y2="440"/><line x1="770" y1="80" x2="770" y2="440"/><line x1="890" y1="80" x2="890" y2="440"/><line x1="980" y1="80" x2="980" y2="440"/>
 </g>

 <g font-size="13">

  <text x="20" y="208">Pilot — 3 sites</text>          <rect x="560" y="192" width="60"  height="24" rx="5" fill="#0F8B8D"/><text x="630" y="209" font-size="11" fill="#4A525C">W10–11</text>
  <text x="20" y="256">Wave 1 — 15 sites</text>        <rect x="650" y="240" width="90"  height="24" rx="5" fill="#2A78D6"/><text x="750" y="257" font-size="11" fill="#4A525C">W13–15</text>
  <text x="20" y="304">Wave 2 — 20 sites</text>        <rect x="740" y="288" width="120" height="24" rx="5" fill="#2A78D6"/><text x="870" y="305" font-size="11" fill="#4A525C">W16–19</text>
  <text x="20" y="352">Wave 3 — 22 sites</text>        <rect x="860" y="336" width="120" height="24" rx="5" fill="#2A78D6"/><text x="990" y="353" font-size="11" fill="#4A525C">W20–23</text>

 </g>
 <!-- go/no-go gates -->
 <g font-size="11" fill="#EB6834" text-anchor="middle">
  <polygon points="620,186 628,178 636,186 628,194" fill="#EB6834"/><text x="628" y="176">Go/No-Go</text>
 </g>
 <text x="20" y="455" font-size="11" fill="#7A838E">Pilot results gate the wider rollout · each wave ends with a site-readiness review · hypercare overlaps the final wave</text>
